# devices/thyme/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device thyme
	title       Xiaomi Mi 10S
	vendor      Xiaomi
	soc         sm8250
	defconfig   thyme_defconfig
	maintainer  printlndarling
	status      display     partial   framebuffer, Adreno and DSI DCS 0x51 paths work; current board-gating fix awaits a RAM retest and physical brightness comparison is pending
	status      touch       partial   ST FTS521 at I2C 0x49, IRQ GPIO39, reset GPIO38; historically verified, current board-gating fix awaits a RAM retest
	status      buttons     partial   PM8150 PON + GPIO6; historically verified, current board-gating fix awaits a RAM retest
	status      cpu         works     7 CPUs; three EPSS domains raised to 1804/2419/3187 MHz on official main
	status      gpu         works     Adreno 650 / zap 0x8c41a000, hardware-rendered SpringBoard
	status      battery     partial   kernel telemetry and charging work; SpringBoard battery/charging refresh is implemented but awaits hardware validation
	status      storage     partial   read-only UFS/GPT survey passed on the rebuilt THYME UEFI; persistent writes and installer design pending
	status      audio       partial   DSP/MI2S/CS35L41 and WCD938x dual-mic capture work; speaker-to-mic acoustic loopback verified, stereo balance pending
	status      haptic      partial   1700 Hz AW8697 playback and repeatable BEMF response verified; F0 advisory unstable, physical feel pending
	status      camera      partial   S5KHMX sensor ID, module selector and power sequencing verified; CSI streaming and capture still pending
	status      torch       works     PM8150L channel 0: bounded pulse and AVFlashlight/mediaserverd on/off verified
	status      wifi        works      QCA6390 startup, 2.4/5 GHz scan, off/on recovery, WPA2 association, DHCP, TLS and Safari page loading verified on the pinned baseline
	status      bluetooth   partial   firmware, iOS H4, LE reception and Settings discovery verified; LE connection establishment, pairing and reconnect pending
	status      cellular    missing   modem and telephony path not implemented
	status      network     partial   en0 DHCP, DNS, TCP/TLS and Safari verified; Wi-Fi power-cycle/rejoin and concurrent Bluetooth discovery verified; sustained transfer and sleep/wake pending
	status      thermal     works     27 TSENS inputs, live throttling, and orderly thermal_stop hand-back verified; soak pending
	status      usb         partial   xnuloader fastboot endpoint works; one endpoint loss observed
	status      sensors     missing   ALS, accelerometer and proximity are not usable
